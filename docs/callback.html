<!doctype html>
<!--
  Optional HTTPS bounce page for the Enable Banking redirect.

  Register this page's public HTTPS URL (e.g. GitHub Pages) as the app's
  redirect URL. bank-sync encodes its own address into `state`
  (`<nonce>.<base64url(base)>`); this page decodes it and forwards the whole
  query string to `<base>/callback` — but only to private/LAN addresses, so
  it can't be used as an open redirect to the internet. The authorization
  code is useless without the app's private key, so passing through here
  leaks nothing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>bank-sync — back from the bank</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        padding: 24px 16px;
        background: #f6f7f9;
        color: #16181d;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14161a;
          color: #e6e6e6;
        }
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        font:
          13px ui-monospace,
          monospace;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="msg">Taking you back to bank-sync…</p>
      <div id="manual" hidden>
        <p>
          Couldn't work out where to send you. Copy this URL and paste it into bank-sync ("Didn't come back here after
          approving?"):
        </p>
        <textarea id="url" rows="4" readonly></textarea>
      </div>
      <script>
        function isPrivateHost(h) {
          if (h === 'localhost' || !h.includes('.')) return true;
          if (/\.(local|home|lan|internal|home\.arpa|ts\.net)$/.test(h)) return true;
          const m = /^(\d+)\.(\d+)\.(\d+)\.(\d+)$/.exec(h);
          if (!m) return false;
          const [a, b] = [Number(m[1]), Number(m[2])];
          return (
            a === 10 ||
            a === 127 ||
            (a === 172 && b >= 16 && b <= 31) ||
            (a === 192 && b === 168) ||
            (a === 100 && b >= 64 && b <= 127)
          );
        }

        function target() {
          const state = new URLSearchParams(location.search).get('state') || '';
          const dot = state.indexOf('.');
          if (dot < 0) return null;
          try {
            const b64 = state
              .slice(dot + 1)
              .replace(/-/g, '+')
              .replace(/_/g, '/');
            const base = new URL(atob(b64));
            if (!/^https?:$/.test(base.protocol) || !isPrivateHost(base.hostname)) return null;
            return base.origin + base.pathname.replace(/\/+$/, '') + '/callback' + location.search;
          } catch {
            return null;
          }
        }

        const t = target();
        if (t) {
          location.replace(t);
        } else {
          document.getElementById('msg').hidden = true;
          document.getElementById('manual').hidden = false;
          document.getElementById('url').value = location.href;
        }
      </script>
    </main>
  </body>
</html>
